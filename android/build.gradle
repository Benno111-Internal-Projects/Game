plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.benno111.engene'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.benno111.engene'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../.deps/game-main/game/assets', '../.deps/game-main/game/shaders/es']
        }
    }
}
