name: Game build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      game_ref:
        description: game-main branch, tag, or full 40-character commit SHA
        default: feature/maze-quick-join

permissions:
  contents: read

jobs:
  gamebuild:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-24.04
          - platform: android
            runner: ubuntu-24.04
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      PROJECT3D_ACCOUNT_URL: ${{ vars.PROJECT3D_ACCOUNT_URL || 'http://critique-unsmooth.tun.ply.gg:49642/' }}
      PROJECT3D_ACCOUNT_PUBLIC_KEY: ${{ vars.PROJECT3D_ACCOUNT_PUBLIC_KEY || '79716e0f177c7179823014e99af314e3a8f563267b0638800bb427d217d9996b' }}

    defaults:
      run:
        working-directory: .deps/game-main

    steps:
      - name: Validate game revision
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GAME_REF: ${{ inputs.game_ref || 'feature/maze-quick-join' }}
        run: |
          if [[ "$GAME_REF" =~ ^[0-9a-fA-F]{4,39}$ ]]; then
            echo "::error::Use the full 40-character commit SHA for game_ref. For a hex-only branch or tag, use refs/heads/ or refs/tags/."
            exit 1
          fi

      - name: Download game-main
        uses: actions/checkout@v4
        with:
          repository: Benno111-Internal-Projects/game-main
          ref: ${{ inputs.game_ref || 'feature/maze-quick-join' }}
          token: ${{ secrets.GAME_READ_TOKEN || secrets.YY }}
          path: .deps/game-main
          persist-credentials: false

      - name: Read framework revision
        id: sources
        shell: bash
        env:
          YY: ${{ secrets.YY }}
        run: |
          revision="$(tr -d '\r\n' < framework-revision.txt)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::framework-revision.txt must contain a full commit SHA."
            exit 1
          fi
          if [[ -z "$YY" ]]; then
            echo "::error::Set the YY Actions secret to a token with read access to Benno111Engene."
            exit 1
          fi
          echo "framework=$revision" >> "$GITHUB_OUTPUT"

      - name: Download Benno111Engene
        uses: actions/checkout@v4
        with:
          repository: Benno111-Internal-Projects/Benno111Engene
          ref: ${{ steps.sources.outputs.framework }}
          token: ${{ secrets.YY }}
          path: .deps/game-main/.deps/Benno111Engene
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libgl1-mesa-dev libasound2-dev pkg-config libcurl4-openssl-dev

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build --parallel
          ./build/benno111-engene --check-levels
          ./build/benno111-engene --check-worlds
          tar -czf benno111-engene-linux.tar.gz -C build benno111-engene assets shaders

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel
          $cli = './build/Release/benno111-engene-cli.exe'
          if (Test-Path $cli) {
            $exe = [IO.File]::ReadAllBytes((Resolve-Path './build/Release/benno111-engene.exe').Path)
            $subsystem = [BitConverter]::ToUInt16($exe, [BitConverter]::ToInt32($exe, 60) + 92)
            if ($subsystem -ne 2) { throw 'The game executable must use the Windows GUI subsystem.' }
          } else {
            $cli = './build/Release/benno111-engene.exe'
          }
          & $cli --check-levels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli --check-worlds

      - name: Package and test Linux installer
        if: matrix.platform == 'linux'
        run: |
          bash installers/build-linux.sh build benno111-engene-linux-setup.run
          export XDG_DATA_HOME="$RUNNER_TEMP/benno111-installer-test"
          ./benno111-engene-linux-setup.run --yes
          "$XDG_DATA_HOME/benno111-engene/benno111-engene" --help
          cmp LICENSE "$XDG_DATA_HOME/benno111-engene/LICENSE"
          "$XDG_DATA_HOME/benno111-engene/uninstall" --yes
          test ! -e "$XDG_DATA_HOME/benno111-engene"
          tar -czf benno111-engene-linux-installer.tar.gz benno111-engene-linux-setup.run

      - name: Package and test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $root = (Get-Location).Path
          $setup = Join-Path $root 'benno111-engene-windows-setup.exe'
          & $makensis "/DBUILD_DIR=$root\build\Release" "/DPROJECT_DIR=$root" "/DOUTPUT_FILE=$setup" installers/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:LOCALAPPDATA 'benno111-engene'
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }
          $cliName = if (Test-Path './build/Release/benno111-engene-cli.exe') {
            'benno111-engene-cli.exe'
          } else {
            'benno111-engene.exe'
          }
          & (Join-Path $installed $cliName) --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash LICENSE).Hash -ne (Get-FileHash (Join-Path $installed 'LICENSE')).Hash) {
            throw 'The installed license differs from the repository license.'
          }
          $uninstall = Start-Process -FilePath (Join-Path $installed 'uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $installed)) { throw 'Uninstall failed.' }

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          gradle -p android assembleDebug
          shopt -s nullglob
          apks=(android/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          unzip -Z1 "${apks[0]}" > apk-files.txt
          grep -Fx 'lib/arm64-v8a/libbenno111_engene.so' apk-files.txt
          grep -Fx 'assets/model.vert' apk-files.txt
          grep -Fx 'assets/sample.obj' apk-files.txt
          grep -Fx 'assets/starter-ambient.ogg' apk-files.txt
          for level in 01 02 03 04 05 06 07; do
            grep -Fx "assets/levels/$level.level" apk-files.txt
            grep -Fx "assets/worlds/$level.world" apk-files.txt
          done

      - name: Build unsigned iOS device app and package IPA
        if: matrix.platform == 'ios'
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build build --config Release --target benno111-engene
          app="$(find build -type d -name benno111-engene.app -print -quit)"
          mkdir -p ios-package/Payload
          cp -R "$app" ios-package/Payload/
          (cd ios-package && zip -qry ../benno111-engene-ios.ipa Payload)

      - name: Upload Linux build
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: benno111-engene-linux
          path: .deps/game-main/benno111-engene-linux.tar.gz
          if-no-files-found: error

      - name: Upload campaign level pack
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dorfplatformer-level-pack
          path: .deps/game-main/game/assets/levels/*.level
          if-no-files-found: error

      - name: Upload main campaign world pack
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: dorfplatformer-world-pack
          path: .deps/game-main/game/assets/worlds/*.world
          if-no-files-found: error

      - name: Upload Windows build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: benno111-engene-windows
          path: |
            .deps/game-main/build/Release/benno111-engene*.exe
            .deps/game-main/build/Release/assets/
            .deps/game-main/build/Release/shaders/
          if-no-files-found: error

      - name: Upload Linux installer
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: benno111-engene-linux-installer
          path: .deps/game-main/benno111-engene-linux-installer.tar.gz
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: benno111-engene-windows-installer
          path: .deps/game-main/benno111-engene-windows-setup.exe
          if-no-files-found: error

      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: benno111-engene-android
          path: .deps/game-main/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload iOS IPA
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: benno111-engene-ios
          path: .deps/game-main/benno111-engene-ios.ipa
          if-no-files-found: error
